<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resentence</title>
<meta name="description" content="Sentence flashcards from saved Rewords vocabulary.">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231c1c1a'/><rect x='8' y='19' width='16' height='4' rx='1' fill='%23e9b949'/></svg>">
<style>
  :root {
    --bg: #f7f5f0;
    --card: #fffdf9;
    --ink: #1c1c1a;
    --muted: #8a877f;
    --line: #e6e2d9;
    --mark: rgba(233, 185, 73, .38);
    --mark-ink: #1c1c1a;
    --accent: #b8860b;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.05);
    --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --card: #1d1d1b; --ink: #ecebe6; --muted: #8d8b84; --line: #2c2c29;
      --mark: rgba(233, 185, 73, .30); --mark-ink: #fff7e0; --accent: #e9b949;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --card: #1d1d1b; --ink: #ecebe6; --muted: #8d8b84; --line: #2c2c29;
    --mark: rgba(233, 185, 73, .30); --mark-ink: #fff7e0; --accent: #e9b949;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; min-height: 100dvh;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, a:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  header, footer {
    width: 100%; max-width: 760px; margin: 0 auto; padding: 20px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--serif); font-size: 18px; letter-spacing: .01em; }
  .brand span { color: var(--accent); }
  .tools { display: flex; gap: 4px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    color: var(--muted); transition: color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--ink); background: var(--line); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 16px; }
  .card {
    width: 100%; max-width: 720px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow); padding: clamp(28px, 6vw, 56px);
    cursor: pointer; user-select: text; transition: opacity .18s ease, transform .18s ease;
  }
  .card.leaving { opacity: 0; transform: translateX(var(--dx, 0)); }
  .sentence {
    font-family: var(--serif); font-size: clamp(21px, 3.4vw, 29px); line-height: 1.55;
    margin: 0; text-wrap: pretty; hyphens: manual;
  }
  .sentence mark {
    color: var(--mark-ink); background: linear-gradient(transparent 58%, var(--mark) 58%);
    padding: 0 .06em; border-radius: 2px;
  }
  .cut { color: var(--muted); }

  .answer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .answer > div { overflow: hidden; }
  .card.open .answer { grid-template-rows: 1fr; }
  .defs { border-top: 1px solid var(--line); margin-top: 32px; padding-top: 24px; display: grid; gap: 18px; }
  .def-word { font-family: var(--serif); font-size: 20px; font-weight: 600; }
  .def-ph { color: var(--muted); font-size: 14px; margin-left: 8px; }
  .def-list { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; line-height: 1.5; }
  .pos { color: var(--muted); font-style: italic; margin-right: 6px; }
  .none { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
  .src { font-size: 13px; color: var(--muted); }
  .src a { color: inherit; text-underline-offset: 3px; }
  .src a:hover { color: var(--ink); }

  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; min-height: 1em; }

  footer { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .nav-btn {
    height: 44px; min-width: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line);
    display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px;
    transition: background .15s, border-color .15s;
  }
  .nav-btn:hover { background: var(--card); border-color: var(--muted); }
  .nav-btn svg { width: 16px; height: 16px; }
  .progress { flex: 1; display: grid; gap: 8px; justify-items: center; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { width: 100%; max-width: 280px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

  .empty { text-align: center; color: var(--muted); font-family: var(--serif); font-size: 20px; }
  @media (max-width: 520px) {
    .nav-btn .lbl { display: none; }
    .nav-btn { padding: 0; width: 44px; justify-content: center; }
    header { padding-top: 14px; padding-bottom: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">Re<span>·</span>sentence</div>
  <div class="tools">
    <button class="icon-btn" id="speak" title="Listen (L)" aria-label="Read sentence aloud">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="icon-btn" id="shuffle" title="Shuffle (S)" aria-label="Shuffle" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    </button>
  </div>
</header>

<main>
  <article class="card" id="card" tabindex="0" aria-live="polite">
    <p class="sentence" id="sentence"></p>
    <div class="answer"><div><div class="defs" id="defs"></div></div></div>
  </article>
</main>
<div class="hint" id="hint">Tap the card to reveal meanings</div>

<footer>
  <button class="nav-btn" id="prev" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Prev</span>
  </button>
  <div class="progress"><span class="count" id="count">– / –</span><div class="bar"><i id="bar"></i></div></div>
  <button class="nav-btn" id="next" aria-label="Next">
    <span class="lbl">Next</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('resentence:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('resentence:' + k, JSON.stringify(v)); } catch {} },
  };
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  let cards = [], order = [], pos = 0, shuffled = store.get('shuffled', false);

  function highlight(card) {
    const terms = card.words.flatMap(w => [w.word, ...(w.forms || [])]).filter(Boolean)
      .sort((a, b) => b.length - a.length).map(reEsc);
    let html = esc(card.text);
    if (terms.length) html = html.replace(new RegExp(`\\b(${terms.join('|')})\\b`, 'gi'), '<mark>$1</mark>');
    return (card.cutStart ? '<span class="cut">… </span>' : '') + html + (card.cutEnd ? '<span class="cut"> …</span>' : '');
  }

  function defsHtml(card) {
    const words = card.words.map(w => {
      const d = w.def;
      const ph = d && d.phonetic ? `<span class="def-ph">${esc(d.phonetic)}</span>` : '';
      const body = d && d.meanings.length
        ? `<ul class="def-list">${d.meanings.map(m => `<li><span class="pos">${esc(m.pos)}</span>${esc(m.def)}</li>`).join('')}</ul>`
        : '<p class="none">No definition saved.</p>';
      return `<div><span class="def-word">${esc(w.word)}</span>${ph}${body}</div>`;
    }).join('');
    const src = card.url
      ? `<div class="src">From <a href="${esc(card.url)}" target="_blank" rel="noopener">${esc(card.source || 'source')}</a></div>`
      : card.source ? `<div class="src">From ${esc(card.source)}</div>` : '';
    return words + src;
  }

  function makeOrder() {
    order = cards.map((_, i) => i);
    if (shuffled) for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]];
    }
  }

  function render() {
    const card = cards[order[pos]];
    $('card').classList.remove('open');
    $('sentence').innerHTML = highlight(card);
    $('defs').innerHTML = defsHtml(card);
    $('count').textContent = `${pos + 1} / ${cards.length}`;
    $('bar').style.width = `${((pos + 1) / cards.length) * 100}%`;
    store.set('current', card.id);
  }

  function go(step) {
    if (!cards.length) return;
    const el = $('card');
    el.style.setProperty('--dx', `${step > 0 ? -16 : 16}px`);
    el.classList.add('leaving');
    setTimeout(() => {
      pos = (pos + step + cards.length) % cards.length;
      render();
      el.style.setProperty('--dx', `${step > 0 ? 16 : -16}px`);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('leaving')));
    }, 160);
  }

  function flip() {
    if (!cards.length || window.getSelection().toString()) return;
    $('card').classList.toggle('open');
    $('hint').textContent = '';
  }

  function speak() {
    if (!cards.length || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cards[order[pos]].text);
    u.lang = 'en-US'; u.rate = 0.95;
    speechSynthesis.speak(u);
  }

  function setShuffle(on) {
    shuffled = on; store.set('shuffled', on);
    $('shuffle').setAttribute('aria-pressed', String(on));
    const current = cards[order[pos]];
    makeOrder();
    if (on) pos = 0;
    else pos = Math.max(0, cards.indexOf(current));
    render();
  }

  $('card').addEventListener('click', e => { if (!e.target.closest('a')) flip(); });
  $('prev').addEventListener('click', () => go(-1));
  $('next').addEventListener('click', () => go(1));
  $('speak').addEventListener('click', speak);
  $('shuffle').addEventListener('click', () => cards.length && setShuffle(!shuffled));
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowright' || k === 'j') go(1);
    else if (k === 'arrowleft' || k === 'k') go(-1);
    else if (k === ' ' || k === 'enter' || k === 'arrowup' || k === 'arrowdown') { e.preventDefault(); flip(); }
    else if (k === 's') $('shuffle').click();
    else if (k === 'l') speak();
  });

  let tx = null, ty = null;
  $('card').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('card').addEventListener('touchend', e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
    tx = ty = null;
  });

  fetch('sentences.json?v=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      cards = data;
      if (!cards.length) throw new Error('empty');
      $('shuffle').setAttribute('aria-pressed', String(shuffled));
      makeOrder();
      const i = cards.findIndex(c => c.id === store.get('current'));
      pos = i >= 0 ? Math.max(0, order.indexOf(i)) : 0;
      render();
      if (store.get('seen', false)) $('hint').textContent = '';
      store.set('seen', true);
    })
    .catch(() => {
      $('card').outerHTML = '<p class="empty">No sentences yet.</p>';
      $('hint').textContent = '';
    });
})();
</script>
</body>
</html>
